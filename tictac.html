<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    #mode-select {
      margin-bottom: 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
    }

    .cell {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .cell:hover {
      transform: scale(1.05);
    }

    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #333;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>

  <div id="mode-select">
    <label>
      <input type="radio" name="mode" value="human" checked />
      Play with Player 2
    </label>
    <label style="margin-left: 10px;">
      <input type="radio" name="mode" value="computer" />
      Play with Computer
    </label>
  </div>

  <div id="board"></div>
  <div id="status">Player X's turn</div>
  <button onclick="resetGame()">Reset Game</button>

  <script>
    const board = document.getElementById("board");
    const status = document.getElementById("status");
    const modeRadios = document.getElementsByName("mode");

    let currentPlayer = "X";
    let gameState = ["", "", "", "", "", "", "", "", ""];
    let isGameActive = true;
    let vsComputer = false;

    const winningCombos = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function createBoard() {
      board.innerHTML = "";
      gameState.forEach((cell, index) => {
        const div = document.createElement("div");
        div.classList.add("cell");
        div.setAttribute("data-index", index);
        div.textContent = cell;
        div.addEventListener("click", handleClick);
        board.appendChild(div);
      });
    }

    function handleClick(e) {
      const index = e.target.getAttribute("data-index");
      if (gameState[index] !== "" || !isGameActive) return;

      gameState[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      checkGameResult();

      if (vsComputer && isGameActive && currentPlayer === "O") {
        setTimeout(computerMove, 500); // delay for realism
      }
    }

    function checkGameResult() {
      let won = false;
      winningCombos.forEach(combo => {
        const [a, b, c] = combo;
        if (
          gameState[a] &&
          gameState[a] === gameState[b] &&
          gameState[a] === gameState[c]
        ) {
          won = true;
          highlightCells(combo);
        }
      });

      if (won) {
        status.textContent = `Player ${currentPlayer} wins!`;
        isGameActive = false;
        return;
      }

      if (!gameState.includes("")) {
        status.textContent = "It's a Tie!";
        isGameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      status.textContent = `Player ${currentPlayer}'s turn`;
    }

    function highlightCells(combo) {
      combo.forEach(i => {
        board.children[i].style.backgroundColor = "#d1fae5";
      });
    }

    function resetGame() {
      gameState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      vsComputer = document.querySelector('input[name="mode"]:checked').value === "computer";
      status.textContent = `Player X's turn`;
      createBoard();
    }

    function computerMove() {
      // Find available spots
      const emptyIndices = gameState.map((val, i) => val === "" ? i : null).filter(i => i !== null);
      if (emptyIndices.length === 0) return;

      // Pick a random spot
      const randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      gameState[randomIndex] = "O";
      board.children[randomIndex].textContent = "O";
      checkGameResult();
    }

    // Initialize
    resetGame();
  </script>
</body>
</html>
